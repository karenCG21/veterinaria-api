services:
  - type: web
    name: veterinaria-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci
    startCommand: npm run db:init && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: veterinaria-db
          property: connectionString

databases:
  - name: veterinaria-db
    databaseName: veterinaria
    user: veterinaria
    plan: free
    region: ohio
    postgresMajorVersion: '18'
